[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["lib/cms-api-core.js"]

# Serverless API routing
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Admin CMS SPA fallback (direct URLs & browser refresh)
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

# Dynamic CMS pages (/p/:slug)
[[redirects]]
  from = "/p/*"
  to = "/index.html"
  status = 200

# Security & Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/p/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/public-cms.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/admin-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
