name: Listen Together Worker checks

on:
  push:
    branches:
      - feature/listen-together-cloudflare
    paths:
      - "cloudflare/listen-together/**"
      - ".github/workflows/listen-together-worker.yml"
  pull_request:
    paths:
      - "cloudflare/listen-together/**"
      - ".github/workflows/listen-together-worker.yml"

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/listen-together
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check Worker
        run: npm run typecheck
      - name: Run multi-client integration tests
        run: npm test
